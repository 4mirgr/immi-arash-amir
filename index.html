<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a111e">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand-aa-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand-aa-180.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>مسیر | دستیار مهاجرت پزشکی</title>
  <style>
    body{margin:0;background:#0a111e}
    .access-screen,.access-screen *{box-sizing:border-box}
    .access-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#183537,#0a111e 65%);color:#eef6ff;font:16px/1.6 system-ui,Tahoma,sans-serif}
    .access-screen .access-card{width:100%;max-width:470px;min-width:0;padding:28px;border:1px solid #314359;border-radius:26px;background:#152234;box-shadow:0 18px 56px #03080d60}
    .access-brand{display:flex;align-items:center;gap:12px;color:#a2fac9}
    .access-card h1,.access-card h2{margin:0 0 .6em;line-height:1.4}
    .access-card h1{font-size:1.6em}.access-card h2{font-size:1.14em}
    .access-card p,.access-card .notice{overflow-wrap:anywhere}
    .access-card p{color:#b7c7d7;margin:.65em 0 1em}
    .access-card form{display:grid;gap:8px}
    .access-card input,.access-card button{width:100%;min-height:44px;font:inherit;padding:9px 12px;border:1px solid #4b6277;border-radius:12px;color:inherit;background:#0f1c2a}
    .access-card input{min-width:0}
    .access-card button{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
    .access-card button:disabled{opacity:.6;cursor:wait}
    .access-card .primary{background:#70e7bb;color:#092725;border-color:transparent;font-weight:700;margin-top:4px}
    .access-card .language-control{width:auto;min-height:36px;padding:3px 12px}
    .access-card a{color:#a4eede}
    .access-card .notice{padding:10px 12px;margin:0 0 12px;border:1px solid #578697;border-radius:11px;background:#193844}
    .access-card :focus-visible{outline:2px solid #81e8d8;outline-offset:3px}
    :root[data-language="en"] .access-screen[dir="rtl"]{direction:ltr}
    @media(max-width:600px){.access-screen{padding:14px}.access-screen .access-card{padding:20px;border-radius:21px}}
  </style>
</head>
<body>
  <div id="root"><main class="access-screen"><section class="access-card">
    <h1>مسیر</h1>
    <p role="status">در حال آماده‌سازی ورود امن…</p>
    <a href="">تازه‌سازی صفحه</a>
    <noscript><p>برای ورود به پنل، جاوااسکریپت مرورگر را فعال کنید.</p></noscript>
  </section></main></div>
  <!-- workspace-styles -->
  <script type="module" src="/src/entry.jsx"></script>
</body>
</html>
