name: Prepare isolated project verification
description: Locked tools and synthetic browser tests without production credentials
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - shell: bash
      run: |
        set -euo pipefail
        npm ci --ignore-scripts
        python -m pip install -r requirements-backup.txt -r requirements-browser.txt
        python -m playwright install --with-deps chromium
